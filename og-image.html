<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OpenShift Games — OpenGraph card (1200×630)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #0d1117;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  position: relative;
}

.grid {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(238,0,0,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(238,0,0,0.07) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: perspective(800px) rotateX(55deg) rotateZ(-15deg) scale(2.2);
  transform-origin: center 80%;
}

.grid-glow {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 400px;
  background: radial-gradient(ellipse at center, rgba(238,0,0,0.16) 0%, transparent 70%);
}

.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0 80px;
}

.logo {
  font-size: 82px;
  font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, #EE0000 0%, #FF4D4D 45%, #F97316 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 40px rgba(238,0,0,0.35));
}

.tagline {
  font-size: 24px;
  color: rgba(255,255,255,0.62);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 500;
}

.exam-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 34px;
  padding: 7px 18px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #FF8080;
  background: rgba(238,0,0,0.12);
  border: 1px solid rgba(238,0,0,0.45);
}

.resources {
  display: flex;
  gap: 22px;
  margin-bottom: 42px;
}

.resource {
  width: 76px;
  height: 76px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transform: translateY(0);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.resource:nth-child(1) { background: linear-gradient(135deg, #EE0000, #B30000); animation: float 3s ease-in-out infinite; }
.resource:nth-child(2) { background: linear-gradient(135deg, #f97316, #c95e12); animation: float 3s ease-in-out 0.3s infinite; }
.resource:nth-child(3) { background: linear-gradient(135deg, #8b5cf6, #6d28d9); animation: float 3s ease-in-out 0.6s infinite; }
.resource:nth-child(4) { background: linear-gradient(135deg, #0ea5e9, #0369a1); animation: float 3s ease-in-out 0.9s infinite; }
.resource:nth-child(5) { background: linear-gradient(135deg, #22c55e, #1a9e4b); animation: float 3s ease-in-out 1.2s infinite; }
.resource:nth-child(6) { background: linear-gradient(135deg, #eab308, #c49607); animation: float 3s ease-in-out 1.5s infinite; }

.resource svg { width: 38px; height: 38px; }
.resource-label {
  position: absolute;
  bottom: -23px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.bottom-bar {
  display: flex;
  align-items: center;
  gap: 18px;
}

.badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: rgba(255,255,255,0.72);
  font-size: 14px;
  font-weight: 500;
}

.badge-icon { font-size: 17px; }
.badge-accent { color: #FF4D4D; font-weight: 700; }

.corner-tl, .corner-tr, .corner-bl, .corner-br {
  position: absolute;
  width: 60px;
  height: 60px;
  border-color: rgba(238,0,0,0.25);
  border-style: solid;
}
.corner-tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; border-radius: 8px 0 0 0; }
.corner-tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; border-radius: 0 8px 0 0; }
.corner-bl { bottom: 24px; left: 24px; border-width: 0 0 2px 2px; border-radius: 0 0 0 8px; }
.corner-br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; border-radius: 0 0 8px 0; }

.url {
  position: absolute;
  bottom: 36px;
  right: 44px;
  font-size: 16px;
  color: rgba(255,77,77,0.7);
  font-weight: 600;
  letter-spacing: 0.02em;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid"></div>
  <div class="grid-glow"></div>

  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <div class="content">
    <div class="logo">OpenShift Games</div>
    <div class="tagline">Learn OpenShift by Playing</div>
    <div class="exam-badge">Built for EX280 · OpenShift 4.22</div>

    <div class="resources">
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="white" stroke-width="1.5" fill="white" fill-opacity="0.2"/></svg>
        <div class="resource-label">Project</div>
      </div>
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="3" stroke="white" stroke-width="1.5" fill="white" fill-opacity="0.2"/></svg>
        <div class="resource-label">Deploy</div>
      </div>
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17c4-9 12-9 16 0" stroke="white" stroke-width="1.5" fill="none"/><circle cx="4" cy="17" r="2" fill="white" fill-opacity="0.6"/><circle cx="20" cy="17" r="2" fill="white" fill-opacity="0.6"/><circle cx="12" cy="9" r="2" fill="white" fill-opacity="0.6"/></svg>
        <div class="resource-label">Route</div>
      </div>
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="white" stroke-width="1.5" fill="white" fill-opacity="0.15"/><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5"/></svg>
        <div class="resource-label">Service</div>
      </div>
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 4.6 3.4 7.9 8 8.6 4.6-.7 8-4 8-8.6V6l-8-4z" stroke="white" stroke-width="1.5" fill="white" fill-opacity="0.15"/><path d="m8.8 12 2.2 2.2 4.2-4.6" stroke="white" stroke-width="1.6"/></svg>
        <div class="resource-label">SCC</div>
      </div>
      <div class="resource">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="white" stroke-width="1.5"/></svg>
        <div class="resource-label">Build</div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="badge">
        <span class="badge-icon">&#9654;</span>
        <span><span class="badge-accent">20</span> Campaign Levels</span>
      </div>
      <div class="badge">
        <span class="badge-icon">&#9201;</span>
        <span><span class="badge-accent">12</span> Timed Labs</span>
      </div>
      <div class="badge">
        <span class="badge-icon">&#127891;</span>
        <span><span class="badge-accent">EX280</span> Prep Mode</span>
      </div>
      <div class="badge">
        <span class="badge-icon">&#128187;</span>
        <span>oc Terminal</span>
      </div>
    </div>
  </div>

  <div class="url">shifting.pro</div>
</body>
</html>
